name: Fast branch data bootstrap

on:
  push:
    branches: [v0.1.1-rider-ux]
    paths:
      - ".github/workflows/bootstrap-fast.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.1-rider-ux

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch nationwide OSM snapshot
        id: refresh
        env:
          OVERPASS_ENDPOINTS: https://overpass.private.coffee/api/interpreter,https://overpass-api.de/api/interpreter
          OVERPASS_TIMEOUT_SECONDS: "45"
          OVERPASS_DELAY_MS: "900"
        run: npm run refresh:data
        continue-on-error: true

      - name: Validate snapshot
        run: npm run validate:data

      - name: Summarize snapshot
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/skateparks.geojson', 'utf8'));
          const failures = data.metadata?.failed_states || [];
          console.log(`Skateparks: ${data.features?.length || 0}`);
          console.log(`Failed states: ${failures.length}`);
          if (failures.length) console.log(`::warning::Partial states: ${failures.map(x => x.state).join(', ')}`);
          NODE

      - name: Commit snapshot to branch
        run: |
          if git diff --quiet -- data/skateparks.geojson; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "concrete-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/skateparks.geojson
          git commit -m "data: bootstrap nationwide skatepark snapshot"
          git push origin HEAD:v0.1.1-rider-ux
