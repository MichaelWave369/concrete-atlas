name: Build data quality report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/skateparks.geojson"
      - ".github/workflows/quality-report.yml"

permissions:
  contents: write

concurrency:
  group: concrete-atlas-quality-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate canonical snapshot
        run: npm run validate:data

      - name: Build quality report
        run: npm run report:data

      - name: Commit changed report
        run: |
          git config user.name "concrete-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/quality-report.json
          if git diff --cached --quiet; then
            echo "Quality report already matches canonical snapshot."
            exit 0
          fi
          git commit -m "data: update quality observatory report"
          git push
