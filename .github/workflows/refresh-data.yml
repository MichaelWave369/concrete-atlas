name: Refresh skatepark data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-data.yml"
  schedule:
    - cron: "17 9 1,15 * *"

permissions:
  contents: write

concurrency:
  group: concrete-atlas-data-refresh
  cancel-in-progress: true

jobs:
  fetch-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: 1
            states: AL,AK,AZ,AR,CA,CO,CT,DE,FL,GA,HI
          - id: 2
            states: ID,IL,IN,IA,KS,KY,LA,ME,MD,MA
          - id: 3
            states: MI,MN,MS,MO,MT,NE,NV,NH,NJ,NM
          - id: 4
            states: NY,NC,ND,OH,OK,OR,PA,RI,SC,SD
          - id: 5
            states: TN,TX,UT,VT,VA,WA,WV,WI,WY,DC
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check ingestion scripts
        run: |
          node --check scripts/fetch-osm-skateparks.mjs
          node --check scripts/merge-skatepark-chunks.mjs
          node --check scripts/build-quality-report.mjs

      - name: Fetch classified skate-location chunk
        id: refresh
        env:
          STATE_CODES: ${{ matrix.states }}
          OVERPASS_ENDPOINTS: https://overpass-api.de/api/interpreter,https://lz4.overpass-api.de/api/interpreter,https://z.overpass-api.de/api/interpreter
          SUPPLEMENTAL_OVERPASS_ENDPOINTS: https://overpass-api.de/api/interpreter,https://lz4.overpass-api.de/api/interpreter
          OVERPASS_TIMEOUT_SECONDS: "20"
          SUPPLEMENTAL_TIMEOUT_SECONDS: "10"
          OVERPASS_DELAY_MS: "2500"
          OVERPASS_RETRY_DELAY_MS: "15000"
          MAX_SOURCE_LAG_HOURS: "72"
          INCLUDE_SUPPLEMENTAL: "true"
          CLASSIFIER_POLICY_VERSION: "0.1"
        run: npm run refresh:data
        continue-on-error: true

      - name: Validate chunk
        run: npm run validate:data

      - name: Preserve chunk
        run: cp data/skateparks.geojson "chunk-${{ matrix.id }}.geojson"

      - uses: actions/upload-artifact@v7
        with:
          name: skatepark-chunk-${{ matrix.id }}
          path: chunk-${{ matrix.id }}.geojson
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: fetch-chunks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          pattern: skatepark-chunk-*
          path: partials
          merge-multiple: true

      - name: Merge and deduplicate chunks
        run: node scripts/merge-skatepark-chunks.mjs partials data/skateparks.geojson

      - name: Validate merged nationwide snapshot
        run: npm run validate:data

      - name: Build data quality observatory report
        run: npm run report:data

      - name: Summarize coverage
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/skateparks.geojson', 'utf8'));
          const quality = JSON.parse(fs.readFileSync('data/quality-report.json', 'utf8'));
          const failures = data.metadata?.failed_states || [];
          const receipts = data.metadata?.state_sources || [];
          const excluded = data.metadata?.excluded_non_facility_count || 0;
          const retainedSupplemental = receipts.reduce((sum, x) => sum + (x.retained_supplemental_feature_count || 0), 0);
          console.log(`Skate candidates: ${data.features?.length || 0}`);
          console.log(`Excluded non-facility candidates: ${excluded}`);
          console.log(`Leisure-only candidates retained after enrichment misses: ${retainedSupplemental}`);
          console.log(`State/DC codes requested: ${data.metadata?.requested_states?.length || 0}`);
          console.log(`Fresh state receipts: ${receipts.length}`);
          console.log(`Failed primary states: ${failures.length}`);
          console.log(`Named coverage: ${quality.field_coverage.named.percent}%`);
          console.log(`Surface coverage: ${quality.field_coverage.surface_known.percent}%`);
          console.log(`Lights coverage: ${quality.field_coverage.lights_known.percent}%`);
          console.log(`Hours coverage: ${quality.field_coverage.opening_hours_known.percent}%`);
          if ((data.metadata?.requested_states?.length || 0) !== 51) throw new Error('Expected 51 state/DC codes');
          if (!data.features?.length) throw new Error('Nationwide snapshot is empty');
          if (failures.length) console.log(`::warning::Primary failures retained in metadata: ${failures.map(x => x.state).join(', ')}`);
          NODE

      - name: Commit changed snapshot and quality report
        run: |
          git config user.name "concrete-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/skateparks.geojson data/quality-report.json
          if git diff --cached --quiet; then
            echo "No data or quality-report changes."
            exit 0
          fi
          git commit -m "data: refresh classified skatepark snapshot and quality report"
          git push
