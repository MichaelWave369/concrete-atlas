name: Refresh skatepark data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1,15 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh OpenStreetMap snapshot
        run: npm run refresh:data
        continue-on-error: true
      - name: Validate snapshot
        run: npm run validate:data
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/skateparks.geojson; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "concrete-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/skateparks.geojson
          git commit -m "data: refresh OSM skatepark snapshot"
          git push
