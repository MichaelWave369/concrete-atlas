name: Concrete Atlas CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check browser JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/quality.js

      - name: Check data pipeline syntax
        run: |
          node --check scripts/fetch-osm-skateparks.mjs
          node --check scripts/merge-skatepark-chunks.mjs
          node --check scripts/enrich-park-intelligence.mjs
          node --check scripts/validate-geojson.mjs
          node --check scripts/build-quality-report.mjs

      - name: Enrich bundled snapshot with Park Intelligence
        run: npm run enrich:intelligence

      - name: Validate enriched GeoJSON snapshot
        run: npm run validate:data

      - name: Build quality report from enriched snapshot
        run: npm run report:data
